title = "tea-bot"

[extend]
useDefault = true

# No se excluyen .env ni .env.*. Un secreto en el worktree o en el historial bloquea.
# Solo se omiten árboles generados que no son código de la app.

[[allowlists]]
description = "Dependencias y artefactos generados"
paths = [
  '''(?:^|/)node_modules/''',
  '''(?:^|/)dist/''',
  '''(?:^|/)coverage/''',
  '''(?:^|/)audit/raw/''',
  '''(?:^|/)\.cache/''',
  '''(?:^|/)__pycache__/''',
]

# Excepciones de valor: condition=AND + targetRules/regexes.
# No se usan paths aquí: en gitleaks un path en allowlist omite el archivo entero.

[[allowlists]]
description = "Fixture de nombre de archivo abcd1234.jpg (generic-api-key), no una API key"
condition = "AND"
targetRules = ["generic-api-key"]
regexes = ['''abcd1234\.jpg''']

[[allowlists]]
description = "SHA-256 de ejemplo documentado para la contraseña de demo Tea2026"
condition = "AND"
regexes = ['''e6cb496be6f8ec1bb9ece061e9d5589919c6d63d1cfde5bc0095f78d657ce29d''']
